# Front RGB camera. Pose is the official URDF ``front_camera_joint`` on
# ``base``. The menagerie MJCF ships no ``<camera>``, so the generic HAL
# camera rig splices this in for `deploy sim`. Intrinsics are NOMINAL
# (same 640×480 / fx=fy=343 pinhole the G1 spliced head cam uses) — not
# a calibrated Go2 lens.
sensors:
  - name: "front"
    modality: "rgb"
    frame_id: "front_camera"
    parent_frame: "base"
    rate_hz: 15.0
    intrinsics:
      width: 640
      height: 480
      fx: 343.0
      fy: 343.0
      cx: 320.0
      cy: 240.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.front"
    sim_placement:
      parent_body: "base"
      pos: [0.32715, -0.00003, 0.04297]
      target: [1.32715, -0.00003, 0.0]
  # Third-person overview (menagerie ``track`` pose). The front camera cannot
  # see the robot — it looks +X from the face. No vla_feature_key: viz only.
  - name: "top"
    modality: "rgb"
    frame_id: "top_camera"
    parent_frame: "base"
    rate_hz: 15.0
    intrinsics:
      width: 640
      height: 480
      fx: 515.0
      fy: 515.0
      cx: 320.0
      cy: 240.0
    encoding: "rgb8"
    sim_placement:
      parent_body: "base"
      pos: [0.846, -1.465, 0.916]
      target: [0.0, 0.0, 0.0]
      fovy_deg: 50.0

capabilities:
  locomotion: ["quadruped"]
  can_lift_kg: 8.0
  has_dexterous_hands: false
  has_tactile: false
  has_force_control: true
  has_vision: true
  has_lidar: false
  has_audio: false
  bimanual: false
  supported_control_modes:
    - "joint_position"
  supported_vla_embodiments:
    - "go2"
  embodiment_tags:
    - "go2"
    - "unitree_go2"
    - "quadruped"

safety:
  max_ee_speed_m_s: 1.5
  max_joint_speed_factor: 0.5
  max_force_n: 100.0
  max_torque_nm: 45.43
  deadman_required: true

# `sdk_kind: open` — menagerie model is BSD-3-Clause (Unitree); `mujoco`
# Python is Apache-2.0. Compatible permissive licenses. A future
# `Go2RealHAL` over `unitree_sdk2` will derive from this baseline via
# `make_real_description` and flip sdk_kind.
sdk_kind: "open"
# Explicit sim/real HAL entrypoints (resolved by openral_hal.build_hal).
# Sim-only → real: null until a unitree_sdk2 adapter + locomotion controller.
hal:
  sim: "openral_hal.go2:Go2MujocoHAL"
  real: null
  # Consumed by ``build_hal`` (not a ROS param — the lifecycle node does
  # not declare ``gravity_enabled``). Required: no gait, so the
  # floating-base twin falls under gravity.
  parameters:
    defaults:
      gravity_enabled: false

# MuJoCo wiring consumed by ``openral_hal.MujocoArmHAL.from_description``.
# Source: ``unitree_go2/go2.xml`` in mujoco_menagerie. Floating-base
# quadruped — qpos starts at 7 (free joint), qvel at 6. keyframe 0 is
# the menagerie ``home`` stand (free-joint height). Actuated hips are then
# snapped to Hub ±0.1 (GO2_HOME_JOINT_TARGETS). Calves cannot rest at 0.
sim:
  floating_base: true
  keyframe_index: 0

# Collision geometry left empty this spike — deploy still MJCF-lowers
# self-collision capsules from the menagerie model. ACM rest-pose
# excludes must use Hub `GO2_HOME_JOINT_TARGETS` (hip ±0.1, thigh 0.9,
# calf −1.8), not q=0 and not menagerie keyframe hips 0.0. Pairs that
# only overlap at that Hub stand (base↔calf, FL_thigh↔FR_thigh,
# base↔thigh, calf↔non-same-leg thigh, calf↔non-same-leg hip) are
# MoveIt-style always-in-collision excludes. Capsule ACM is
# conservative — not a mesh or cert claim. Self-collision stays on
# for every other pair.
collision_geometry: []
allowed_collision_pairs: []
schema_version: '0.1'
