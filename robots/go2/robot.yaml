    axis_xyz: [1, 0, 0]
    joint_type: "revolute"
    parent_link: "base"
    child_link: "FL_hip"
    position_limits: [-1.0472, 1.0472]
    velocity_limit: 15.0
    effort_limit: 23.7
    has_torque_sensor: true
    actuator_kind: "bldc"
