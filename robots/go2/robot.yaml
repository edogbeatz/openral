# RobotDescription — Unitree Go2 quadruped (physical embodiment, sim baseline).
#
# Mirrors `GO2_DESCRIPTION` in python/hal/src/openral_hal/go2.py (drift guarded
# by tests/unit/test_robot_manifests_match_hal_constants.py). Joint limits +
# effort caps come verbatim from the official Unitree Go2 URDF
# (`unitreerobotics/unitree_ros` `go2_description.urdf`) and match the
# mujoco_menagerie `unitree_go2` MJCF.
#
# `Go2MujocoHAL` is the only execution path today; real-HW HAL over
# `unitree_sdk2` is a follow-up (same M2 / S0 posture as G1/H1). Without a
# locomotion controller the digital twin is a contract validator only
# (falls over under gravity) — tests/sim/test_go2_hal_mujoco.py and
# scenes/deploy/go2_bench.yaml run with gravity_enabled=False.
#
# 12 actuated joints: FL / FR / RL / RR × (hip, thigh, calf). Floating-base
# qpos[0..6] is implicit world state, NOT enumerated. Rear thighs have a
# wider range than the front pair (URDF fact). Calf range excludes 0 —
# connect() loads menagerie keyframe 0 (free-joint height) then snaps
# actuated joints to Hub deploy.yaml default_joint_pos (hip ±0.1).
#
# This is a sim-only spike. Go2 Edu (extra cameras / compute) is a follow-up.
# Hardware has a face radar; it is NOT declared here (no calibrated lidar
# spec in-tree). Collision geometry is empty — safety self-collision is a
# remaining gap (see robots/go2/README.md).

name: "go2"
embodiment_kind: "quadruped"
base_frame: "base"

# robot_state_publisher wiring. URDF root link is ``base``, matching
# base_frame; no static transform needed.
assets:
  urdf:
    ref: "rd:go2_description"
  mjcf: "rd:go2_mj_description"

