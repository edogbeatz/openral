name: quality
# Quality gate on every PR: lockfile check + ruff + mypy --strict + schema drift
# + docs build. `uv lock --check` then `uv sync --frozen` — a stale lock fails
# the job; never fall back to a silent re-resolve.
# Fast (<3 min) and high signal. The `mkdocs build --strict` step runs here
# (rather than as a separate docs-on-PR trigger) so it reuses this job's already
# -synced --all-packages env — catching the `--strict` doc breakage that pages.yml
# would otherwise only surface post-merge, at ~zero extra CI cost.
on:
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Check lockfile
        run: uv lock --check
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: bash tools/run_mypy.sh
      - name: Check schema drift
        run: uv run python tools/schema_export.py --check
      - name: Check rSkill SKILL.md drift
        run: uv run python tools/generate_rskill_skillmd.py --check
      - name: Validate robot/skill/scene manifests
        run: uv run openral check
      - name: Build docs (mkdocs --strict)
        run: uv run mkdocs build --strict
