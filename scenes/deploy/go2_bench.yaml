# Unitree Go2 quadruped bench — deploy playground (bare MuJoCo digital twin).
#
# Sim-only spike. Boots the manifest-driven Go2 twin with gravity off so
# the floating-base quadruped holds the menagerie `home` stand without a
# locomotion controller. The generic camera rig splices the manifest's
# front RGB camera onto `base`. Pair with:
#
#   openral doctor
#   openral deploy sim --config scenes/deploy/go2_bench.yaml
#   openral deploy sim --config scenes/deploy/go2_bench.yaml --dry-run
#
# Gravity is pinned off in ``robots/go2/robot.yaml``
# ``hal.parameters.defaults`` (consumed by ``build_hal``). Do not put
# ``gravity_enabled`` in this scene's ``hal.defaults`` — that block
# becomes ROS params and the lifecycle node does not declare it.
#
# `deploy run` is refused (`hal.real` is null). No walking policy, no
# Go2 Edu extras. Every perception/nav leg is off: the bare twin has no
# lidar/depth and this bench is a HAL pipe proof, not a VLA rollout.
#
# Home-stand ACM: MJCF-lowered capsules are conservative (not a mesh /
# cert claim). At menagerie `home` (thigh 0.9, calf −1.8) they overlap
# base↔calf and hip↔calf. OpenRAL #6 snaps hips to Hub ±0.1, which also
# admits FL_thigh↔FR_thigh, base↔thigh, the full calf↔non-same-leg
# thigh set, and the full calf↔non-same-leg hip set (SimOps after #33:
# FR_calf↔RR_hip ≈ −18.8 mm). HAL spawn / ACM seed_q must match Hub
# `GO2_HOME_JOINT_TARGETS`. These extras are home-stand admits only.
# Self-collision stays ON for every other pair. Not a disable-all-safety
# flag. Not a skill_ran / gait claim.
extra_allowed_collision_pairs:
  - [base, FL_calf]
  - [base, FR_calf]
  - [base, RL_calf]
  - [base, RR_calf]
  - [FL_hip, FL_calf]
  - [FR_hip, FR_calf]
  - [RL_hip, RL_calf]
  - [RR_hip, RR_calf]
  - [FL_thigh, FR_thigh]
  - [RL_thigh, RR_thigh]
  - [base, FL_thigh]
  - [base, FR_thigh]
  - [base, RL_thigh]
  - [base, RR_thigh]
  - [FL_calf, FR_thigh]
  - [FL_calf, RL_thigh]
  - [FL_calf, RR_thigh]
  - [FR_calf, FL_thigh]
  - [FR_calf, RL_thigh]
  - [FR_calf, RR_thigh]
  - [RL_calf, FL_thigh]
  - [RL_calf, FR_thigh]
  - [RL_calf, RR_thigh]
  - [RR_calf, FL_thigh]
  - [RR_calf, FR_thigh]
  - [RR_calf, RL_thigh]
  - [FL_calf, FR_hip]
  - [FL_calf, RL_hip]
  - [FL_calf, RR_hip]
  - [FR_calf, FL_hip]
  - [FR_calf, RL_hip]
  - [FR_calf, RR_hip]
  - [RL_calf, FL_hip]
  - [RL_calf, FR_hip]
  - [RL_calf, RR_hip]
  - [RR_calf, FL_hip]
  - [RR_calf, FR_hip]
  - [RR_calf, RL_hip]
scene:
  id: go2_bench
robot_id: go2
runtime:
  enable_slam: false
  enable_nav2: false
  enable_octomap: false
  enable_octomap_kernel_check: true
  enable_object_detector: false
  object_detector_onnx: null
  object_detector_manifest: null
  object_detector_query: null
  object_detector_locators: null
  enable_reward_monitor: false
  reward_monitor_manifest: null
  reward_monitor_task: null
  enable_critic: false
  spatial_memory_ingest: false
  approach_skill_id: null
